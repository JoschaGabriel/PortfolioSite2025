    <style>
        .caveat-im {
            font-family: "Caveat", serif;

        .liquid-glass {
        width: 60px;
        height: 60px;
        border-radius: 30px;
        position: relative;
        isolation: isolate;
        box-shadow: 0px 6px 24px rgba(0, 0, 0, 0.1);
        display: flex;
        align-items: center;
        justify-content: center;
        position: fixed;
        border: none;
        background: none;
        padding: 0;
        margin: 0;
        text-decoration: none;
        cursor: pointer;
        pointer-events: none; /* Crucial: allows clicks to pass through to elements below */
        transform: translate(-50%, -50%); /* CENTERS the element on the mouse coordinates */
        transition: transform 0.1s ease-out, opacity 0.3s ease-in-out; /* Smooth movement and show/hide */
        z-index: 9999; /* Ensures it's always on top */
        opacity: 0; /* Start hidden */
        }

        .liquid-glass:focus {
        outline: none;
        }

        .liquid-glass::before {
        content: '';
        position: absolute;
        inset: 0;
        z-index: 0;
        border-radius: 30px;
        box-shadow: inset 0 0 0px 0px #000000;
        background-color: rgba(255, 255, 255, 0.05);
        }

        .liquid-glass::after {
        content: '';
        position: absolute;
        inset: 0;
        z-index: -1;
        border-radius: 30px;
        backdrop-filter: blur(1px);
        -webkit-backdrop-filter: blur(1px);
        filter: url(#glass-distortion);
        -webkit-filter: url(#glass-distortion);
        }

        .cursor-circle {
            fill: transparent; /* No fill for the SVG circle itself */
            /* You could add a stroke here if you wanted an inner border on the SVG circle */
            /* stroke: rgba(255, 255, 255, 0.3); */
            /* stroke-width: 1; */
        }

        .background-liquid-section {
            background-image: url("data:image/svg+xml,<svg id='patternId' width='100%' height='100%' xmlns='http://www.w3.org/2000/svg'><defs><pattern id='a' patternUnits='userSpaceOnUse' width='20' height='20' patternTransform='scale(1) rotate(0)'><rect x='0' y='0' width='100%' height='100%' fill='%23271d1dff'/><path d='M 10,-2.55e-7 V 20 Z M -1.1677362e-8,10 H 20 Z'  stroke-width='1' stroke='%232c1f1fff' fill='none'/></pattern></defs><rect width='800%' height='800%' transform='translate(0,0)' fill='url(%23a)'/></svg>")
        }
    </style>

    <script type="module">
        // Wait for DOM and all libraries to load
document.addEventListener('DOMContentLoaded', () => {
    
    // ===== HEADER SCROLL =====
    const header = document.getElementById('myHeader');
    const body = document.body;
    let lastScrollTop = 0;
  
    if (header) {
        window.addEventListener('scroll', () => {
            let scrollTop = window.pageYOffset || document.documentElement.scrollTop;
        
            if (scrollTop > lastScrollTop) { // Scrolling down
                header.classList.remove('hidden');
                body.classList.add('body-padding');
            } else { // Scrolling up
                header.classList.add('hidden');
                body.classList.remove('body-padding');
            }
            lastScrollTop = scrollTop;
        });
    }

    // ===== HOVER MASTER =====
    const serviceItems = document.querySelectorAll('[data-targets]');
    const allItems = document.querySelectorAll('[data-item]');

    if (serviceItems.length > 0) {
        serviceItems.forEach(item => {
            const targets = item.dataset.targets.split(',').map(target => target.trim());
            
            item.addEventListener('mouseenter', () => {
                item.style.fontWeight = '600';
                item.style.color = '#745545';

                allItems.forEach(targetItem => {
                    if (targets.includes(targetItem.dataset.item)) {
                        targetItem.style.fontWeight = 'semibold';
                        targetItem.style.color = "#745545";
                        targetItem.style.textDecoration = 'underline';
                    }
                });
            });

            item.addEventListener('mouseout', () => {
                item.style.fontWeight = 'normal';
                item.style.color = '#C1A090';

                allItems.forEach(targetItem => {
                    if (targets.includes(targetItem.dataset.item)) {
                        targetItem.style.fontWeight = 'normal';
                        targetItem.style.color = "#C1A090";
                        targetItem.style.textDecoration = 'none';
                    }
                });
            });
        });
    }

    // ===== TEXT HOVER EFFECTS =====
    const textHovers = [
        { textSelector: '.text-link1', popupSelector: '.image-popup1' },
        { textSelector: '.text-link2', popupSelector: '.image-popup2' },
        { textSelector: '.text-link3', popupSelector: '.image-popup3' },
        { textSelector: '.text-link4', popupSelector: '.image-popup4' }
    ];

    textHovers.forEach(({ textSelector, popupSelector }) => {
        const textLink = document.querySelector(textSelector);
        const popup = document.querySelector(popupSelector);

        if (textLink && popup) {
            textLink.addEventListener('mouseover', () => {
                popup.style.display = 'block';
            });

            textLink.addEventListener('mouseout', () => {
                popup.style.display = 'none';
            });
        }
    });

    // ===== ANIME.JS ANIMATIONS =====
    if (typeof anime !== 'undefined') {
        const animationTargets = [
            { selector: '.main-text-logo', delay: 10 },
            { selector: '.main-text-hi', delay: 200 },
            { selector: '.main-text-in', delay: 400 },
            { selector: '.main-text-ui', delay: 600 },
            { selector: '.main-text-link', delay: 800 }
        ];

        animationTargets.forEach(({ selector, delay }) => {
            const elements = document.querySelectorAll(selector);
            if (elements.length > 0) {
                anime({
                    delay: delay,
                    opacity: 100,
                    targets: elements,
                    translateY: -20,
                    duration: 3000,
                    easing: 'easeInOutQuad',
                });
            }
        });
    } else {
        console.warn('anime.js is not loaded');
    }

    // ===== POWERGLITCH =====
    if (typeof PowerGlitch !== 'undefined') {
        const glitchElements = document.querySelector('.glitch');
        if (glitchElements) {
            PowerGlitch.glitch('.glitch', {
                "playMode": "hover",
                "optimizeSeo": true,
                "createContainers": true,
                "hideOverflow": false,
                "timing": {
                    "duration": 2000
                },
                "glitchTimeSpan": {
                    "start": 0.1,
                    "end": 0.4
                },
                "shake": {
                    "velocity": 15,
                    "amplitudeX": 0.2,
                    "amplitudeY": 0.2
                },
                "slice": {
                    "count": 6,
                    "velocity": 15,
                    "minHeight": 0.02,
                    "maxHeight": 0.15,
                    "hueRotate": 0,
                },
                "pulse": false
            });
        }
    } else {
        console.warn('PowerGlitch is not loaded');
    }

    // ===== POPUP =====
    const popup = document.querySelector('.popup');
    const closeButton = document.getElementById('closePopup');
    let hasShown = false;

    if (popup && closeButton) {
        closeButton.addEventListener('click', () => {
            popup.style.display = 'none';
            hasShown = true;
        });

        window.addEventListener('scroll', () => {
            if (window.scrollY === 0 && hasShown) {
                popup.style.display = 'block';
                hasShown = false;
            }
        });
    }

    // ===== MOTION.JS SCROLL ANIMATIONS =====
    if (typeof window.Motion !== 'undefined') {
        const { animate, inView } = window.Motion;

        const scrollAnimations = [
            { selector: '.menu1', y: -100, duration: 180 },
            { selector: '.menu2', y: -150, duration: 190 },
            { selector: '.menu3', y: -200, duration: 200 },
            { selector: '.menu4', y: -250, duration: 210 }
        ];

        scrollAnimations.forEach(({ selector, y, duration }) => {
            const elements = document.querySelectorAll(selector);
            if (elements.length > 0) {
                inView(selector, (element) => {
                    animate(element, { opacity: 1, x: 0, y: 0 });
                    return () => animate(element, { opacity: 0, y: y, duration: duration });
                });
            }
        });

        inView(".scroll-section-right", (element) => {
            animate(element, { opacity: 1, x: [-100, 0] }, {
                duration: 0.9,
                easing: [0.17, 0.55, 0.55, 1],
            });
            return () => animate(element, { opacity: 0, x: -100 });
        });

        inView(".scroll-section-up", (element) => {
            animate(element, { opacity: 1, y: [100, 0] }, {
                duration: 0.9,
                easing: [0.10, 0.55, 0.55, 1],
            });
            return () => animate(element, { opacity: 0, y: 100 });
        });

        inView(".scroll-section-down", (element) => {
            animate(element, { opacity: 1, y: [0, 0] }, {
                duration: 1.1,
                easing: [0.10, 0.55, 0.55, 1],
            });
            return () => animate(element, { opacity: 0, y: 100 });
        });

        inView(".scroll-section-left", (element) => {
            animate(element, { opacity: 1, x: [0, -10] }, {
                duration: 0.3,
                easing: [0.10, 0.55, 0.55, 1],
            });
            return () => animate(element, { opacity: 0, y: 0 });
        });
    } else {
        console.warn('Motion.js is not loaded');
    }

    // ===== LENIS SMOOTH SCROLL =====
    if (typeof Lenis !== 'undefined') {
        const lenis = new Lenis({
            autoRaf: true,
        });

        lenis.on('scroll', (e) => {
            console.log(e);
        });
    } else {
        console.warn('Lenis is not loaded');
    }

    // ===== CUSTOM CURSOR 1 - HERO =====
    const targetDiv = document.querySelector('.container');
    const cursorSource = document.querySelector('.cursor-source');
    
    if (targetDiv && cursorSource) {
        targetDiv.addEventListener('mouseenter', () => {
            cursorSource.style.display = 'block';
            document.body.style.cursor = 'none';
        });

        targetDiv.addEventListener('mouseleave', () => {
            cursorSource.style.display = 'none';
            document.body.style.cursor = 'default';
        });

        document.addEventListener('mousemove', (event) => {
            cursorSource.style.left = (event.clientX - 25) + 'px';
            cursorSource.style.top = (event.clientY - 25) + 'px';
        });
    } else {
        if (!targetDiv) console.warn('.container element not found');
        if (!cursorSource) console.warn('.cursor-source element not found');
    }

    // ===== CUSTOM CURSOR 2 - FOOTER =====
    const cursorSource2 = document.querySelector('.cursor-source2');
    if (cursorSource2) {
        document.addEventListener('mousemove', (event) => {
            cursorSource2.style.left = (event.clientX - 25) + 'px';
            cursorSource2.style.top = (event.clientY - 25) + 'px';
        });
    } else {
        console.warn('.cursor-source2 element not found');
    }

    // ===== CUSTOM CURSOR 3 =====
    const targetDiv3 = document.querySelector('.container3');
    const cursorSource3 = document.querySelector('.cursor-source3');
    
    if (targetDiv3 && cursorSource3) {
        targetDiv3.addEventListener('mouseenter', () => {
            cursorSource3.style.display = 'block';
            document.body.style.cursor = 'none';
        });

        targetDiv3.addEventListener('mouseleave', () => {
            cursorSource3.style.display = 'none';
            document.body.style.cursor = 'default';
        });

        document.addEventListener('mousemove', (event) => {
            cursorSource3.style.left = (event.clientX - 6) + 'px';
            cursorSource3.style.top = (event.clientY - 4) + 'px';
        });
    } else {
        if (!targetDiv3) console.warn('.container3 element not found');
        if (!cursorSource3) console.warn('.cursor-source3 element not found');
    }

    // ===== HOVER IMAGE TEXT =====
    const hoverTexts = document.querySelectorAll('.hover-text');

    if (hoverTexts.length > 0) {
        hoverTexts.forEach(text => {
            const imageId = text.dataset.target;
            const image = document.getElementById(imageId);

            if (image) {
                text.addEventListener('mouseover', (event) => {
                    if (text.dataset.image) {
                        image.src = text.dataset.image;
                    }
                    image.style.display = 'block';
                    positionImage(event, image);
                });

                text.addEventListener('mouseout', () => {
                    image.style.display = 'none';
                });

                text.addEventListener('mousemove', (event) => {
                    if (image.style.display === 'block') {
                        positionImage(event, image);
                    }
                });
            } else {
                console.warn(`Image element with ID "${imageId}" not found for hover-text`);
            }
        });
    }

    // ===== POSITION IMAGE FUNCTION =====
    function positionImage(event, image) {
        const x = event.clientX + 10;
        const y = event.clientY + 10;
        image.style.left = x + 'px';
        image.style.top = y + 'px';
    }

});
    </script>
