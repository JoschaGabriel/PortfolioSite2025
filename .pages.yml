media:
  input: public/images
  output: /images

content:
  - name: posts
    label: Blog posts
    type: collection
    path: content/posts
    filename: '{year}-{month}-{day}-{slug}'
    fields:
      - name: title
        label: Post title
        type: string
        required: true

      - name: date
        label: Publish date
        type: date
        required: true

      - name: slug
        label: URL slug
        type: string
        description: Leave blank to derive from the filename.

      - name: draft
        label: Draft (hide from the site)
        type: boolean
        default: true

      - name: description
        label: Summary
        type: text
        description: Shown on the blog listing and in search/social previews.

      - name: image
        label: Cover image
        type: image

      - name: tags
        label: Tags
        type: list
        field:
          name: tag
          type: string

      - name: body
        label: Content
        type: rich-text